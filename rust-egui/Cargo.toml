[package]
name = "rust-egui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.37.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
chardetng = "1"
encoding_rs = "0.8"

[dev-dependencies]
# Headless UI tests: state assertions only, no image snapshots, so no
# wgpu/snapshot features (and no GPU requirement in the test VM).
egui_kittest = { version = "0.37.0", features = ["eframe"] }
